<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grafo — Visualizador de Algoritmos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #14171f;
      --surface2: #1c2030;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.13);
      --text: #e8eaf0;
      --muted: #6b7280;
      --accent: #6ee7b7;       /* verde-menta */
      --accent2: #f59e0b;      /* ámbar */
      --accent3: #818cf8;      /* violeta */
      --danger: #f87171;
      --node-default: #1c2030;
      --node-k: #2d2a14;
      --node-ij: #1a1f2e;
      --mono: 'JetBrains Mono', monospace;
      --display: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header & Config ── */
    header {
      padding: 1.5rem 2rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .header-title {
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }
    header h1 {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    header span {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #config-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select {
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 4px;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border2);
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--accent); }

    /* ── Layout ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 320px;
      grid-template-rows: auto 1fr;
      gap: 0;
    }

    /* ── Graph panel ── */
    #graph-panel {
      grid-column: 1;
      grid-row: 1 / 3;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    #status-bar {
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #status-bar .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .tag-k  { background: rgba(245,158,11,0.15); color: var(--accent2); }
    .tag-upd { background: rgba(110,231,183,0.12); color: var(--accent); }
    .tag-done { background: rgba(129,140,248,0.15); color: var(--accent3); }

    #svg-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    svg#graph { overflow: visible; max-width: 520px; width: 100%; }

    .edge { stroke: var(--border2); stroke-width: 1.5; fill: none; transition: stroke 0.3s, stroke-width 0.3s, stroke-dasharray 0.3s, opacity 0.3s; }
    .edge.active { stroke: var(--accent); stroke-width: 3; }
    .edge.k-edge { stroke: var(--accent2); stroke-width: 2.5; }
    .edge.is-discarded { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4; opacity: 0.4; }
    .edge-weight { font-family: var(--mono); font-size: 11px; fill: var(--muted); }

    .node-circle {
      fill: var(--node-default);
      stroke: var(--border2);
      stroke-width: 1.5;
      transition: fill 0.3s, stroke 0.3s, stroke-width 0.3s;
    }
    .node-circle.is-k  { fill: rgba(245,158,11,0.18); stroke: var(--accent2); stroke-width: 2.5; }
    .node-circle.is-ij { fill: rgba(129,140,248,0.12); stroke: var(--accent3); stroke-width: 2; }
    .node-circle.is-closed { fill: rgba(107,114,128,0.2); stroke: var(--muted); stroke-width: 1.5; }
    .node-label { font-family: var(--display); font-size: 15px; font-weight: 700; fill: var(--text); }

    /* ── Controls ── */
    #controls {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      padding: 7px 16px;
      border-radius: 6px;
      border: 1px solid var(--border2);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover:not(:disabled) { background: #252836; border-color: rgba(255,255,255,0.2); }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.3; cursor: default; }
    .btn.accent { background: rgba(110,231,183,0.1); border-color: rgba(110,231,183,0.3); color: var(--accent); }
    .btn.accent:hover:not(:disabled) { background: rgba(110,231,183,0.18); }

    #step-counter {
      margin-left: auto;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* ── Right sidebar ── */
    #sidebar {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow-y: auto;
    }

    .side-section {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .side-label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    /* ── Matrices & Tables ── */
    table.matrix {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
    }
    .matrix th, .matrix td {
      width: 40px;
      height: 32px;
      text-align: center;
      border: 1px solid var(--border);
      transition: background 0.25s, color 0.25s;
      position: relative;
    }
    .matrix th { color: var(--muted); font-weight: 500; background: transparent; border-color: transparent; }
    .matrix td { color: var(--text); }
    .matrix td.cell-k   { background: rgba(245,158,11,0.12); color: var(--accent2); }
    .matrix td.cell-ij  { background: rgba(129,140,248,0.08); }
    .matrix td.cell-cur { background: rgba(110,231,183,0.08); }
    .matrix td.cell-upd { background: rgba(110,231,183,0.2); color: var(--accent); font-weight: 700; }
    .matrix td.cell-diag { color: var(--muted); }

    /* ── Pseudocode ── */
    #pseudo-block {
      background: transparent;
      font-family: var(--mono);
      font-size: 0.72rem;
      line-height: 2;
      color: var(--muted);
    }
    #pseudo-block .line { padding: 0 6px; border-radius: 3px; display: block; transition: background 0.2s, color 0.2s; white-space: pre; }
    #pseudo-block .line.active { background: rgba(110,231,183,0.12); color: var(--accent); }
    #pseudo-block .kw { color: var(--accent3); }
    #pseudo-block .sym { color: var(--accent2); }

    /* ── Legend ── */
    .legend { display: flex; flex-direction: column; gap: 6px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; color: var(--muted); }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto; }
      #graph-panel { border-right: none; border-bottom: 1px solid var(--border); }
      #sidebar { grid-column: 1; grid-row: 2; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>Grafos</h1>
    <span>visualizador paso a paso</span>
  </div>
  <div id="config-bar">
    <select id="algo-select" onchange="changeConfig()">
      <optgroup label="Caminos Mínimos (Dirigido)">
        <option value="fw">Floyd-Warshall</option>
        <option value="dijkstra">Dijkstra</option>
        <option value="astar">A* (A-Star)</option>
      </optgroup>
      <optgroup label="Árbol de Expansión Mínima (No Dirigido)">
        <option value="kruskal">Kruskal</option>
        <option value="prim">Prim</option>
      </optgroup>
    </select>
    <select id="start-node" onchange="changeConfig()" style="display:none;">
      <option value="0">Origen: A</option>
      <option value="1">Origen: B</option>
      <option value="2">Origen: C</option>
      <option value="3">Origen: D</option>
    </select>
    <select id="target-node" onchange="changeConfig()" style="display:none;">
      <option value="0">Destino: A</option>
      <option value="1">Destino: B</option>
      <option value="2">Destino: C</option>
      <option value="3" selected>Destino: D</option>
    </select>
  </div>
</header>

<main>
  <div id="graph-panel">
    <div id="status-bar">
      <span id="status-text">Cargando...</span>
    </div>

    <div id="svg-container">
      <svg id="graph" viewBox="0 0 440 320" role="img">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
                  stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>

        <line id="e-0-1" class="edge" x1="110" y1="80" x2="246" y2="80" marker-end="url(#arr)"/>
        <text class="edge-weight" x="178" y="70" text-anchor="middle">3</text>

        <line id="e-0-2" class="edge" x1="78"  y1="105" x2="78"  y2="220" marker-end="url(#arr)"/>
        <text class="edge-weight" x="57" y="166" text-anchor="middle">8</text>

        <line id="e-1-3" class="edge" x1="296" y1="102" x2="373" y2="220" marker-end="url(#arr)"/>
        <text class="edge-weight" x="345" y="158" text-anchor="middle">2</text>

        <line id="e-2-1" class="edge" x1="98"  y1="238" x2="248" y2="110" marker-end="url(#arr)"/>
        <text class="edge-weight" x="158" y="188" text-anchor="middle">4</text>

        <line id="e-3-0" class="edge" x1="362" y1="238" x2="102" y2="104" marker-end="url(#arr)"/>
        <text class="edge-weight" x="236" y="176" text-anchor="middle">5</text>

        <line id="e-2-3" class="edge" x1="104" y1="248" x2="355" y2="248" marker-end="url(#arr)"/>
        <text class="edge-weight" x="230" y="268" text-anchor="middle">1</text>

        <g class="node" id="node-0">
          <circle class="node-circle" id="nc-0" cx="80"  cy="85"  r="26"/>
          <text class="node-label" x="80"  y="85"  text-anchor="middle" dominant-baseline="central">A</text>
        </g>
        <g class="node" id="node-1">
          <circle class="node-circle" id="nc-1" cx="272" cy="85"  r="26"/>
          <text class="node-label" x="272" y="85"  text-anchor="middle" dominant-baseline="central">B</text>
        </g>
        <g class="node" id="node-2">
          <circle class="node-circle" id="nc-2" cx="80"  cy="248" r="26"/>
          <text class="node-label" x="80"  y="248" text-anchor="middle" dominant-baseline="central">C</text>
        </g>
        <g class="node" id="node-3">
          <circle class="node-circle" id="nc-3" cx="382" cy="248" r="26"/>
          <text class="node-label" x="382" y="248" text-anchor="middle" dominant-baseline="central">D</text>
        </g>
      </svg>
    </div>

    <div id="controls">
      <button class="btn" id="btn-prev" onclick="prevStep()" disabled>
        ← Anterior
      </button>
      <button class="btn accent" id="btn-next" onclick="nextStep()">
        Siguiente →
      </button>
      <button class="btn" onclick="runAll()">⏩ Todo</button>
      <button class="btn" onclick="reset()">↺ Reiniciar</button>
      <span id="step-counter">0 / 0</span>
    </div>
  </div>

  <div id="sidebar">
    <div class="side-section">
      <div class="side-label" id="matrix-title">Estado</div>
      <div id="matrix-wrap"></div>
    </div>

    <div class="side-section">
      <div class="side-label">Pseudocódigo</div>
      <div id="pseudo-block"></div>
    </div>

    <div class="side-section">
      <div class="side-label">Referencias</div>
      <div class="legend" id="legend-box"></div>
    </div>
  </div>
</main>

<script>
  const INF = Infinity;
  const N   = 4;
  const LBL = ['A','B','C','D'];

  const NODES_POS = [
    { x: 80,  y: 85  },
    { x: 272, y: 85  },
    { x: 80,  y: 248 },
    { x: 382, y: 248 }
  ];

  // Matriz dirigida
  const W = [
    [0,   3,   8,   INF],
    [INF, 0,   INF, 2  ],
    [INF, 4,   0,   1  ],
    [5,   INF, INF, 0  ]
  ];

  // Aristas no dirigidas para MST (Kruskal/Prim)
  const MST_EDGES = [
    { u: 0, v: 1, w: 3, id: 'e-0-1' },
    { u: 0, v: 2, w: 8, id: 'e-0-2' },
    { u: 1, v: 3, w: 2, id: 'e-1-3' },
    { u: 2, v: 1, w: 4, id: 'e-2-1' },
    { u: 3, v: 0, w: 5, id: 'e-3-0' },
    { u: 2, v: 3, w: 1, id: 'e-2-3' }
  ];

  let steps = [];
  let idx   = 0;
  let currentAlgo = 'fw';

  function heuristica(u, target) {
    const dx = NODES_POS[u].x - NODES_POS[target].x;
    const dy = NODES_POS[u].y - NODES_POS[target].y;
    return Math.round(Math.sqrt(dx * dx + dy * dy) / 30); 
  }

  /* ── Constructores de Pasos (Caminos) ── */
  function buildFloydWarshall() {
    let s = [];
    let d = W.map(r => [...r]);
    s.push({ dist: d.map(r=>[...r]), k:-1, i:-1, j:-1, updated:false, msg: 'Inicialización: <span style="color:var(--accent)">dist[i][j]</span> = peso del arco i→j.', pseudo: -1 });

    for (let k = 0; k < N; k++) {
      s.push({ dist: d.map(r=>[...r]), k, i:-1, j:-1, updated:false, msg: `Intermediario <span class="tag tag-k">k = ${LBL[k]}</span>`, pseudo: 0 });
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          if (i === j) continue;
          const via = (d[i][k] === INF || d[k][j] === INF) ? INF : d[i][k] + d[k][j];
          const updated = via < d[i][j];
          if (updated) d[i][j] = via;
          s.push({ dist: d.map(r=>[...r]), k, i, j, updated, msg: updated ? `<span class="tag tag-upd">✓ Actualizado</span> dist[${LBL[i]}][${LBL[j]}] = <strong style="color:var(--accent)">${via}</strong>` : `dist[${LBL[i]}][${LBL[j]}] = ${fmt(d[i][j])} — no mejora vía ${LBL[k]}.`, pseudo: updated ? 5 : 3 });
        }
      }
    }
    s.push({ dist: d.map(r=>[...r]), k:-1, i:-1, j:-1, updated:false, msg: `<span class="tag tag-done">✓ Listo</span> Matrices calculadas.`, pseudo: -1 });
    return s;
  }

  function buildDijkstra(start) {
    let s = [];
    let dist = Array(N).fill(INF), visited = Array(N).fill(false);
    dist[start] = 0;
    s.push({ dist: [...dist], visited: [...visited], u: -1, v: -1, updated: false, msg: `Origen: <span class="tag tag-k">${LBL[start]}</span>.`, pseudo: 0 });

    for (let i = 0; i < N; i++) {
      let u = -1, minDist = INF;
      for (let j = 0; j < N; j++) { if (!visited[j] && dist[j] < minDist) { minDist = dist[j]; u = j; } }
      if (u === -1) break;
      visited[u] = true;
      s.push({ dist: [...dist], visited: [...visited], u, v: -1, updated: false, msg: `Visitamos <strong style="color:var(--accent2)">${LBL[u]}</strong> (dist: ${dist[u]}).`, pseudo: 1 });

      for (let v = 0; v < N; v++) {
        if (W[u][v] !== INF && W[u][v] !== 0 && !visited[v]) {
          let alt = dist[u] + W[u][v];
          let updated = alt < dist[v];
          if (updated) dist[v] = alt;
          s.push({ dist: [...dist], visited: [...visited], u, v, updated, msg: updated ? `<span class="tag tag-upd">✓ Actualizado</span> dist[${LBL[v]}] = <strong style="color:var(--accent)">${alt}</strong>` : `Vecino ${LBL[v]}: ruta alternativa (${alt}) es mayor.`, pseudo: updated ? 3 : 2 });
        }
      }
    }
    s.push({ dist: [...dist], visited: [...visited], u: -1, v: -1, updated: false, msg: `<span class="tag tag-done">✓ Listo</span> Distancias mínimas desde ${LBL[start]}.`, pseudo: -1 });
    return s;
  }

  function buildAStar(start, target) {
    let s = [];
    let gScore = Array(N).fill(INF), fScore = Array(N).fill(INF), openSet = [start], closedSet = Array(N).fill(false);
    gScore[start] = 0; fScore[start] = heuristica(start, target);
    s.push({ gScore: [...gScore], fScore: [...fScore], closedSet: [...closedSet], openSet: [...openSet], u: -1, v: -1, updated: false, msg: `Origen: <span class="tag tag-k">${LBL[start]}</span>, Destino: <strong>${LBL[target]}</strong>.`, pseudo: 0 });

    while (openSet.length > 0) {
      let currentIdx = 0;
      for (let i = 1; i < openSet.length; i++) { if (fScore[openSet[i]] < fScore[openSet[currentIdx]]) currentIdx = i; }
      let u = openSet[currentIdx];

      if (u === target) {
        s.push({ gScore: [...gScore], fScore: [...fScore], closedSet: [...closedSet], openSet: [...openSet], u, v: -1, updated: false, msg: `<span class="tag tag-done">✓ Listo</span> Llegamos a <strong>${LBL[target]}</strong> (costo ${gScore[target]}).`, pseudo: -1 });
        break;
      }
      openSet.splice(currentIdx, 1);
      closedSet[u] = true;
      s.push({ gScore: [...gScore], fScore: [...fScore], closedSet: [...closedSet], openSet: [...openSet], u, v: -1, updated: false, msg: `Evaluamos <strong style="color:var(--accent2)">${LBL[u]}</strong> (f(n) = ${fScore[u]}).`, pseudo: 1 });

      for (let v = 0; v < N; v++) {
        if (W[u][v] !== INF && W[u][v] !== 0) {
          if (closedSet[v]) continue;
          let tentative_gScore = gScore[u] + W[u][v], updated = false;
          if (!openSet.includes(v)) { openSet.push(v); updated = true; }
          else if (tentative_gScore < gScore[v]) { updated = true; }

          if (updated) {
            gScore[v] = tentative_gScore; fScore[v] = gScore[v] + heuristica(v, target);
          }
          s.push({ gScore: [...gScore], fScore: [...fScore], closedSet: [...closedSet], openSet: [...openSet], u, v, updated, msg: updated ? `<span class="tag tag-upd">✓ Actualizado</span> ${LBL[v]}: g(${gScore[v]})+h(${heuristica(v, target)})=f(<strong style="color:var(--accent)">${fScore[v]}</strong>)` : `Ruta a ${LBL[v]} ignorada.`, pseudo: updated ? 3 : 2 });
        }
      }
    }
    return s;
  }

  /* ── Constructores de Pasos (Árboles) ── */
  function buildKruskal() {
    let s = [];
    let edges = [...MST_EDGES].sort((a,b) => a.w - b.w).map(e => ({...e, status: 'pending'}));
    let parent = Array(N).fill(0).map((_,i) => i);
    let mstEdges = [];
    
    function find(i) {
      if (parent[i] === i) return i;
      return parent[i] = find(parent[i]);
    }

    s.push({ edges: JSON.parse(JSON.stringify(edges)), parent: [...parent], mstEdges: [...mstEdges], u: -1, v: -1, msg: "Inicialización: Ordenamos las aristas por peso de menor a mayor.", pseudo: 0 });

    for (let i = 0; i < edges.length; i++) {
      let e = edges[i];
      edges[i].status = 'evaluating';
      s.push({ edges: JSON.parse(JSON.stringify(edges)), parent: [...parent], mstEdges: [...mstEdges], u: e.u, v: e.v, evalEdge: e, msg: `Evaluamos la arista <strong style="color:var(--accent2)">${LBL[e.u]}-${LBL[e.v]}</strong> (peso ${e.w}).`, pseudo: 1 });

      let rootU = find(e.u);
      let rootV = find(e.v);

      if (rootU !== rootV) {
        parent[rootU] = rootV;
        mstEdges.push(e.id);
        edges[i].status = 'mst';
        s.push({ edges: JSON.parse(JSON.stringify(edges)), parent: [...parent], mstEdges: [...mstEdges], u: e.u, v: e.v, evalEdge: e, updated: true, msg: `<span class="tag tag-upd">✓ Añadida</span> No forma ciclo. Se añade al MST.`, pseudo: 3 });
      } else {
        edges[i].status = 'discarded';
        s.push({ edges: JSON.parse(JSON.stringify(edges)), parent: [...parent], mstEdges: [...mstEdges], u: e.u, v: e.v, evalEdge: e, updated: false, msg: `Forma ciclo. Se <strong style="color:var(--danger)">descarta</strong>.`, pseudo: 4 });
      }
    }
    s.push({ edges: JSON.parse(JSON.stringify(edges)), parent: [...parent], mstEdges: [...mstEdges], u: -1, v: -1, msg: `<span class="tag tag-done">✓ Listo</span> Árbol de Expansión Mínima completado.`, pseudo: -1 });
    return s;
  }

  function buildPrim(start) {
    let s = [];
    let inMST = Array(N).fill(false);
    let mstEdges = [];
    inMST[start] = true;
    
    s.push({ inMST: [...inMST], mstEdges: [...mstEdges], frontier: [], u: start, v: -1, msg: `Iniciamos en el nodo <span class="tag tag-k">${LBL[start]}</span>.`, pseudo: 0 });

    let edgesCount = 0;
    while(edgesCount < N - 1) {
      let frontier = MST_EDGES.filter(e => (inMST[e.u] && !inMST[e.v]) || (!inMST[e.u] && inMST[e.v]));
      if(frontier.length === 0) break;

      s.push({ inMST: [...inMST], mstEdges: [...mstEdges], frontier: frontier.map(e=>e.id), u: -1, v: -1, msg: `Buscamos la arista de menor peso que conecte el árbol con un nodo nuevo.`, pseudo: 1 });

      frontier.sort((a,b) => a.w - b.w);
      let minE = frontier[0];
      let newNode = inMST[minE.u] ? minE.v : minE.u;
      let mstNode = inMST[minE.u] ? minE.u : minE.v;

      inMST[newNode] = true;
      mstEdges.push(minE.id);
      edgesCount++;

      s.push({ inMST: [...inMST], mstEdges: [...mstEdges], frontier: frontier.map(e=>e.id), u: mstNode, v: newNode, evalEdge: minE, updated: true, msg: `<span class="tag tag-upd">✓ Añadida</span> Arista <strong style="color:var(--accent)">${LBL[minE.u]}-${LBL[minE.v]}</strong> seleccionada. Agregamos ${LBL[newNode]}.`, pseudo: 3 });
    }
    s.push({ inMST: [...inMST], mstEdges: [...mstEdges], frontier: [], u: -1, v: -1, msg: `<span class="tag tag-done">✓ Listo</span> Árbol de Expansión Mínima completado.`, pseudo: -1 });
    return s;
  }

  function fmt(v) { return v === INF ? '∞' : v; }

  /* ── Render Matrix / Tables ── */
  function renderMatrix(s) {
    let h = '';
    if (currentAlgo === 'fw') {
      document.getElementById('matrix-title').innerText = 'Matriz dist[i][j]';
      h += '<table class="matrix"><tr><th></th>';
      for (let c = 0; c < N; c++) h += `<th>${LBL[c]}</th>`;
      h += '</tr>';
      for (let r = 0; r < N; r++) {
        h += `<tr><th>${LBL[r]}</th>`;
        for (let c = 0; c < N; c++) {
          let cls = '';
          if (r === c) cls = 'cell-diag';
          else if (r === s.i && c === s.j && s.updated) cls = 'cell-upd';
          else if (r === s.i && c === s.j) cls = 'cell-cur';
          else if ((r === s.k || c === s.k) && s.k >= 0) cls = 'cell-k';
          else if ((r === s.i || c === s.j) && s.i >= 0) cls = 'cell-ij';
          h += `<td class="${cls}">${fmt(s.dist[r][c])}</td>`;
        }
        h += '</tr>';
      }
      h += '</table>';
    } 
    else if (currentAlgo === 'dijkstra') {
      document.getElementById('matrix-title').innerText = 'Arreglo dist[i]';
      h += '<table class="matrix"><tr><th>Nodo</th><th>Dist</th></tr>';
      for (let i = 0; i < N; i++) {
        let cls = '';
        if (s.visited && s.visited[i]) cls = 'cell-diag';
        if (i === s.u) cls = 'cell-k';
        if (i === s.v && s.updated) cls = 'cell-upd';
        else if (i === s.v) cls = 'cell-cur';
        h += `<tr><th>${LBL[i]}</th><td class="${cls}">${fmt(s.dist[i])}</td></tr>`;
      }
      h += '</table>';
    }
    else if (currentAlgo === 'astar') {
      document.getElementById('matrix-title').innerText = 'Valores g(n) y f(n)';
      h += '<table class="matrix"><tr><th>Nodo</th><th>g</th><th>f</th></tr>';
      for (let i = 0; i < N; i++) {
        let cls = '';
        if (s.closedSet && s.closedSet[i]) cls = 'cell-diag';
        if (i === s.u) cls = 'cell-k';
        if (i === s.v && s.updated) cls = 'cell-upd';
        else if (i === s.v) cls = 'cell-cur';
        h += `<tr><th>${LBL[i]}</th><td class="${cls}">${fmt(s.gScore[i])}</td><td class="${cls}">${fmt(s.fScore[i])}</td></tr>`;
      }
      h += '</table>';
    }
    else if (currentAlgo === 'kruskal') {
      document.getElementById('matrix-title').innerText = 'Aristas Ordenadas';
      h += '<table class="matrix"><tr><th>Arista</th><th>Peso</th><th>Estado</th></tr>';
      if(s.edges) s.edges.forEach(e => {
          let statusIcon = e.status === 'mst' ? '✓' : e.status === 'discarded' ? '✗' : e.status === 'evaluating' ? '→' : '-';
          let cls = e.status === 'mst' ? 'cell-upd' : e.status === 'discarded' ? 'cell-diag' : e.status === 'evaluating' ? 'cell-k' : '';
          h += `<tr><th>${LBL[e.u]}-${LBL[e.v]}</th><td>${e.w}</td><td class="${cls}">${statusIcon}</td></tr>`;
      });
      h += '</table>';
    }
    else if (currentAlgo === 'prim') {
      document.getElementById('matrix-title').innerText = 'Estado del Árbol';
      h += '<table class="matrix"><tr><th>Nodo</th><th>En MST?</th></tr>';
      for(let i=0; i<N; i++) {
          let inM = s.inMST && s.inMST[i];
          let cls = inM ? 'cell-upd' : '';
          if(i === s.v && s.updated) cls = 'cell-upd'; // Recién añadido
          else if(i === s.v) cls = 'cell-cur'; 
          else if(i === s.u) cls = 'cell-k';
          h += `<tr><th>${LBL[i]}</th><td class="${cls}">${inM ? 'Sí' : 'No'}</td></tr>`;
      }
      h += '</table>';
    }
    document.getElementById('matrix-wrap').innerHTML = h;
  }

  /* ── Render Pseudocode ── */
  const PSEUDOS = {
    fw: [
      { indent: 0, html: '<span class="kw">for</span> k <span class="kw">in</span> 0..n-1:' },
      { indent: 1, html: '<span class="kw">for</span> i <span class="kw">in</span> 0..n-1:' },
      { indent: 2, html: '<span class="kw">for</span> j <span class="kw">in</span> 0..n-1:' },
      { indent: 3, html: '<span class="kw">if</span> dist[i][k] <span class="sym">+</span> dist[k][j] <span class="sym"><</span> dist[i][j]:' },
      { indent: 4, html: 'dist[i][j] <span class="sym">=</span> dist[i][k] <span class="sym">+</span> dist[k][j]' }
    ],
    dijkstra: [
      { indent: 0, html: 'dist[start] <span class="sym">=</span> 0' },
      { indent: 0, html: '<span class="kw">while</span> Q <span class="kw">is not</span> empty:' },
      { indent: 1, html: 'u <span class="sym">=</span> min_dist(Q)' },
      { indent: 1, html: '<span class="kw">for</span> v <span class="kw">in</span> neighbors(u):' },
      { indent: 2, html: 'alt <span class="sym">=</span> dist[u] <span class="sym">+</span> weight(u, v)' },
      { indent: 2, html: '<span class="kw">if</span> alt <span class="sym"><</span> dist[v]:' },
      { indent: 3, html: 'dist[v] <span class="sym">=</span> alt' }
    ],
    astar: [
      { indent: 0, html: 'gScore[start] <span class="sym">=</span> 0; fScore[start] <span class="sym">=</span> h(start)' },
      { indent: 0, html: '<span class="kw">while</span> openSet <span class="kw">is not</span> empty:' },
      { indent: 1, html: 'u <span class="sym">=</span> node <span class="kw">with</span> lowest fScore' },
      { indent: 1, html: '<span class="kw">for</span> v <span class="kw">in</span> neighbors(u):' },
      { indent: 2, html: 'alt_g <span class="sym">=</span> gScore[u] <span class="sym">+</span> weight(u, v)' },
      { indent: 2, html: '<span class="kw">if</span> alt_g <span class="sym"><</span> gScore[v]:' },
      { indent: 3, html: 'gScore[v] <span class="sym">=</span> alt_g; fScore[v] <span class="sym">=</span> alt_g <span class="sym">+</span> h(v)' }
    ],
    kruskal: [
      { indent: 0, html: 'edges <span class="sym">=</span> sort(all_edges)' },
      { indent: 0, html: '<span class="kw">for</span> e <span class="kw">in</span> edges:' },
      { indent: 1, html: '<span class="kw">if</span> find(e.u) <span class="sym">!=</span> find(e.v):' },
      { indent: 2, html: 'union(e.u, e.v)' },
      { indent: 2, html: 'mst.add(e)' },
      { indent: 1, html: '<span class="kw">else</span>:' },
      { indent: 2, html: '<span class="kw">continue</span> (discard)' }
    ],
    prim: [
      { indent: 0, html: 'inMST[start] <span class="sym">=</span> true' },
      { indent: 0, html: '<span class="kw">while</span> mst_edges <span class="sym"><</span> V - 1:' },
      { indent: 1, html: 'e <span class="sym">=</span> min_edge(crosses MST boundary)' },
      { indent: 1, html: 'inMST[e.new_node] <span class="sym">=</span> true' },
      { indent: 1, html: 'mst.add(e)' }
    ]
  };

  function renderPseudo(s) {
    const p = PSEUDOS[currentAlgo];
    let activeLines = [];
    
    if (currentAlgo === 'fw') {
      if (s.pseudo === 0) activeLines = [0];
      if (s.pseudo === 3) activeLines = [3];
      if (s.pseudo === 5) activeLines = [3, 4];
    } else if (currentAlgo === 'dijkstra' || currentAlgo === 'astar') {
      if (s.pseudo === 0) activeLines = [0];
      if (s.pseudo === 1) activeLines = [2];
      if (s.pseudo === 2) activeLines = [4, 5];
      if (s.pseudo === 3) activeLines = [4, 5, 6];
    } else if (currentAlgo === 'kruskal') {
      if (s.pseudo === 0) activeLines = [0];
      if (s.pseudo === 1) activeLines = [1, 2];
      if (s.pseudo === 3) activeLines = [3, 4];
      if (s.pseudo === 4) activeLines = [5, 6];
    } else if (currentAlgo === 'prim') {
      if (s.pseudo === 0) activeLines = [0];
      if (s.pseudo === 1) activeLines = [1, 2];
      if (s.pseudo === 3) activeLines = [3, 4];
    }

    document.getElementById('pseudo-block').innerHTML = p.map((l, i) => {
      const indent = ' '.repeat(l.indent * 4);
      return `<span class="line${activeLines.includes(i)?' active':''}">${indent}${l.html}</span>`;
    }).join('');
  }

  function renderLegend() {
    let h = '';
    if (currentAlgo === 'fw') {
      h += `<div class="legend-item"><div class="legend-dot" style="background:rgba(245,158,11,0.5)"></div>Intermediario (k)</div>`;
      h += `<div class="legend-item"><div class="legend-dot" style="background:rgba(129,140,248,0.4)"></div>Par (i, j)</div>`;
    } else if (currentAlgo === 'dijkstra' || currentAlgo === 'astar') {
      h += `<div class="legend-item"><div class="legend-dot" style="background:rgba(245,158,11,0.5)"></div>Nodo actual (u)</div>`;
      h += `<div class="legend-item"><div class="legend-dot" style="background:rgba(129,140,248,0.4)"></div>Vecino evaluado (v)</div>`;
      h += `<div class="legend-item"><div class="legend-dot" style="background:rgba(107,114,128,0.3)"></div>Visitado / Cerrado</div>`;
    } else if (currentAlgo === 'kruskal') {
      h += `<div class="legend-item"><div class="legend-dot" style="background:rgba(110,231,183,0.4)"></div>Arista en MST</div>`;
      h += `<div class="legend-item"><div class="legend-dot" style="background:rgba(245,158,11,0.5)"></div>Evaluando</div>`;
      h += `<div class="legend-item"><div class="legend-dot" style="background:rgba(107,114,128,0.3)"></div>Descartada (Ciclo)</div>`;
    } else if (currentAlgo === 'prim') {
      h += `<div class="legend-item"><div class="legend-dot" style="background:rgba(110,231,183,0.4)"></div>Parte del MST</div>`;
      h += `<div class="legend-item"><div class="legend-dot" style="background:rgba(245,158,11,0.5)"></div>Arista Frontera / Evaluando</div>`;
    }
    document.getElementById('legend-box').innerHTML = h;
  }

  /* ── Highlight Graph ── */
  function renderGraph(s) {
    document.querySelectorAll('.node-circle').forEach(c => c.classList.remove('is-k','is-ij','is-closed'));
    document.querySelectorAll('.edge').forEach(e => e.classList.remove('active','k-edge','is-discarded'));

    const isMST = currentAlgo === 'kruskal' || currentAlgo === 'prim';
    document.querySelectorAll('.edge').forEach(e => {
      if (isMST) e.removeAttribute('marker-end');
      else e.setAttribute('marker-end', 'url(#arr)');
    });

    if (currentAlgo === 'fw') {
      if (s.k >= 0) document.getElementById(`nc-${s.k}`).classList.add('is-k');
      if (s.i >= 0) document.getElementById(`nc-${s.i}`).classList.add('is-ij');
      if (s.j >= 0) document.getElementById(`nc-${s.j}`).classList.add('is-ij');

      if (s.i >= 0 && s.k >= 0) { [`e-${s.i}-${s.k}`, `e-${s.k}-${s.i}`].forEach(id => { let el = document.getElementById(id); if (el) el.classList.add('k-edge'); }); }
      if (s.k >= 0 && s.j >= 0) { [`e-${s.k}-${s.j}`, `e-${s.j}-${s.k}`].forEach(id => { let el = document.getElementById(id); if (el) el.classList.add('k-edge'); }); }
      if (s.updated && s.i >= 0 && s.j >= 0) { let el = document.getElementById(`e-${s.i}-${s.j}`); if (el) { el.classList.remove('k-edge'); el.classList.add('active'); } }
    } 
    else if (currentAlgo === 'dijkstra' || currentAlgo === 'astar') {
      if (s.visited) s.visited.forEach((vis, i) => { if(vis) document.getElementById(`nc-${i}`).classList.add('is-closed'); });
      if (s.closedSet) s.closedSet.forEach((vis, i) => { if(vis) document.getElementById(`nc-${i}`).classList.add('is-closed'); });
      if (s.u >= 0) document.getElementById(`nc-${s.u}`).classList.add('is-k');
      if (s.v >= 0) document.getElementById(`nc-${s.v}`).classList.add('is-ij');

      if (s.u >= 0 && s.v >= 0) { let el = document.getElementById(`e-${s.u}-${s.v}`); if (el) { if (s.updated) el.classList.add('active'); else el.classList.add('k-edge'); } }
    }
    else if (currentAlgo === 'kruskal') {
      if (s.mstEdges) s.mstEdges.forEach(id => { let el = document.getElementById(id); if(el) el.classList.add('active'); });
      if (s.edges) {
        s.edges.forEach(e => {
          if (e.status === 'discarded') document.getElementById(e.id).classList.add('is-discarded');
          if (e.status === 'evaluating') document.getElementById(e.id).classList.add('k-edge');
        });
      }
      if (s.u >= 0) document.getElementById(`nc-${s.u}`).classList.add('is-ij');
      if (s.v >= 0) document.getElementById(`nc-${s.v}`).classList.add('is-ij');
    }
    else if (currentAlgo === 'prim') {
      if (s.inMST) s.inMST.forEach((inM, i) => { if(inM) document.getElementById(`nc-${i}`).classList.add('is-closed'); });
      if (s.mstEdges) s.mstEdges.forEach(id => { let el = document.getElementById(id); if(el) el.classList.add('active'); });
      if (s.frontier) s.frontier.forEach(id => { let el = document.getElementById(id); if(el && !el.classList.contains('active')) el.classList.add('k-edge'); });
      if (s.evalEdge) { let el = document.getElementById(s.evalEdge.id); if(el) { el.classList.remove('k-edge'); el.classList.add('active'); } }
      
      if (s.u >= 0) document.getElementById(`nc-${s.u}`).classList.add('is-k'); // Nodo conectado desde el MST
      if (s.v >= 0) document.getElementById(`nc-${s.v}`).classList.add('is-ij'); // Nodo nuevo explorado
    }
  }

  /* ── Core Loop ── */
  function apply(i) {
    const s = steps[i];
    document.getElementById('status-text').innerHTML = s.msg || 'Listo.';
    renderMatrix(s);
    renderPseudo(s);
    renderGraph(s);
    document.getElementById('step-counter').textContent = `${i} / ${steps.length - 1}`;
    document.getElementById('btn-prev').disabled = i <= 0;
    document.getElementById('btn-next').disabled = i >= steps.length - 1;
  }

  function changeConfig() {
    currentAlgo = document.getElementById('algo-select').value;
    const startNode = parseInt(document.getElementById('start-node').value);
    const targetNode = parseInt(document.getElementById('target-node').value);
    
    document.getElementById('start-node').style.display = (currentAlgo === 'fw' || currentAlgo === 'kruskal') ? 'none' : 'inline-block';
    document.getElementById('target-node').style.display = currentAlgo === 'astar' ? 'inline-block' : 'none';

    renderLegend();

    if (currentAlgo === 'fw') steps = buildFloydWarshall();
    else if (currentAlgo === 'dijkstra') steps = buildDijkstra(startNode);
    else if (currentAlgo === 'astar') steps = buildAStar(startNode, targetNode);
    else if (currentAlgo === 'kruskal') steps = buildKruskal();
    else if (currentAlgo === 'prim') steps = buildPrim(startNode);

    idx = 0;
    apply(0);
  }

  /* ── Navegación ── */
  function nextStep() { if (idx < steps.length - 1) { idx++; apply(idx); } }
  function prevStep() { if (idx > 0) { idx--; apply(idx); } }
  function runAll() { idx = steps.length - 1; apply(idx); }
  function reset() { idx = 0; apply(idx); }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextStep(); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); prevStep(); }
    if (e.key === 'r' || e.key === 'R') reset();
  });

  /* ── Init ── */
  changeConfig();
</script>
</body>
</html>
